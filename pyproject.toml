[project]
name = "nexus"
version = "0.1.0"
description = "Nexus: Autonomous Multi-Agent Orchestration Hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
nexus = "nexus.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
